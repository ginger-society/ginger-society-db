apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: build-db-runtime-image-and-push-to-registry
  namespace: tasks-gingersociety-database
  annotations:
    x-ginger-task-namespace: "gingersociety-database"
    x-ginger-task-trigger-branch: '["refs/heads/main"]' 

spec:
  workspaces:
      - name: source
      - name: ssh-credentials  # Store SSH keys
      - name: ssh-config  # Store SSH setup
      - name: kubeconfig
      - name: buildah-cache  # Workspace for caching
      - name: pipeline-secrets
      - name: general-purpose-cache
  steps:
    - name: clone
      image: containers.gingersociety.org/secure-git-task-runner:latest
      script: |
        #!/bin/sh
        set -e  # Exit on error

        /usr/local/bin/configurator.sh
        
        git config --global init.defaultBranch main
        git clone git@source.gingersociety.org:gingersociety-database /workspace/source/repo
        echo "Repository cloned successfully."

    - name: build-db-runtime-image-and-push-to-registry
      image: containers.gingersociety.org/enhanced-buildah:latest
      script: |
        #!/bin/sh
        set -e  # Exit on error

        /usr/local/bin/configurator_buildah.sh
        ls -la /workspace/buildah-cache
        echo "Logging into container registry..."
        echo "mypassword" | buildah login --username "myuser" --password-stdin containers.gingersociety.org

        cd /workspace/source/repo/IAM
        echo "Building db runtime image with Buildah"
        buildah bud --isolation=chroot --storage-driver=vfs --root=$CONTAINERS_STORAGE -t containers.gingersociety.org/gingersociety/iam-db-runtime:prod .

        echo "Pushing image to registry..."
        buildah push --storage-driver=vfs containers.gingersociety.org/gingersociety/iam-db-runtime:prod

      securityContext:
        privileged: true

    - name: restart-deployment
      image: containers.gingersociety.org/secure-git-task-runner:latest
      script: |
        #!/bin/sh
        set -e
        echo "🔹 Setting KUBECONFIG..."
        cp -r /workspace/kubeconfig /keys
        export KUBECONFIG=/workspace/kubeconfig/kubeconfig.gingersociety.prod.yml
        echo "Rolling out restart"
        kubectl rollout restart deployment iam-db-runtime \
          -n default



      



